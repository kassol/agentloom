version: 1

filesystem_policy:
  read_only:
    - /usr
    - /lib
    - /bin
    - /etc
    - /opt/codex-loom
  read_write:
    - /sandbox
    - /tmp

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# The unrestricted local Loom API is intentionally not reachable. A future
# experiment must add one destination only after a scoped relay exists.
network_policies: {}
